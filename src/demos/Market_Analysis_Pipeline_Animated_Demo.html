<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regional Renewables Market Analysis Pipeline — animated walkthrough</title>
<style>
:root{
  --bg:#0a0806;
  --text:#705a42;
  --text-muted:#544432;
  --text-bright:#9e8264;
  --line:#30271d;
  --btn-bg:#120e0a;
  --btn-hover-bg:#1c1610;
  --active-bg:#30271d;
  --active-text:#d4bea7;
}
*,*::before,*::after{
  box-sizing:border-box;
  border-radius:0 !important;
  box-shadow:none !important;
}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:#0a0806;border-left:1px solid #30271d;}
::-webkit-scrollbar-thumb{background:#30271d;}
::-webkit-scrollbar-thumb:hover{background:#705a42;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Courier New',Courier,monospace;
  line-height:1.4;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1600px;margin-inline:auto;padding:16px}
.stage{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#0a0806;
  border:1px solid var(--line);
  overflow:hidden;
}
.stage:fullscreen{border:none;aspect-ratio:auto;width:100vw;height:100vh}
canvas{display:block;width:100%;height:100%;object-fit:contain;background:#0a0806}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-block-start:12px}
button{
  font-family:'Courier New',Courier,monospace;
  font-size:13px;
  line-height:1.2;
  color:var(--text);
  background:var(--btn-bg);
  border:1px solid var(--line);
  padding:8px 14px;
  cursor:pointer;
  user-select:none;
  transition:background 0.1s,border-color 0.1s,color 0.1s;
}
button:hover{
  background:var(--btn-hover-bg);
  border-color:var(--text);
  color:var(--text-bright);
}
button:focus-visible{
  outline:1px solid var(--text);
  outline-offset:1px;
}
button.primary{
  background:var(--active-bg);
  border-color:var(--text);
  color:var(--active-text);
  min-inline-size:110px;
  font-weight:bold;
}
button.primary:hover{
  background:#423628;
  border-color:var(--text-bright);
  color:#f0e2d3;
}
.seg{display:inline-flex;gap:0}
.seg button:not(:first-child){border-left:none}
.seg button[aria-pressed="true"]{
  background:var(--active-bg);
  border-color:var(--text);
  color:var(--active-text);
  font-weight:bold;
}
.seg button[aria-pressed="true"]:hover{
  background:#423628;
  color:#f0e2d3;
}
.spacer{flex:1}
.chapters{display:flex;flex-wrap:wrap;gap:6px;margin-block-start:10px}
.chapters button{
  font-family:'Courier New',Courier,monospace;
  font-size:12px;
  line-height:1.2;
  padding:6px 10px;
  background:var(--btn-bg);
  color:var(--text);
  border:1px solid var(--line);
}
.chapters button:hover{
  background:var(--btn-hover-bg);
  border-color:var(--text);
  color:var(--text-bright);
}
.chapters button.on{
  background:var(--active-bg);
  border-color:var(--text);
  color:var(--active-text);
  font-weight:bold;
}
.progress{
  height:6px;
  background:var(--btn-bg);
  border:1px solid var(--line);
  margin-block-start:10px;
  cursor:pointer;
  position:relative;
}
.progress div{
  height:100%;
  background:var(--text);
  inline-size:0;
}
.progress:hover div{background:var(--text-bright)}
.hint{
  font-family:'Courier New',Courier,monospace;
  font-size:12px;
  line-height:1.4;
  color:var(--text);
  opacity:0.85;
  margin-block:10px 0;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage"><canvas id="cv" width="1600" height="900" aria-label="Animated walkthrough of the regional renewables market analysis pipeline"></canvas></div>
  <div class="controls">
    <button id="bRestart" type="button">⟲ Restart</button>
    <button id="bPrev" type="button">◀ Previous</button>
    <button id="bPlay" class="primary" type="button">❚❚ Pause</button>
    <button id="bNext" type="button">Next ▶</button>
    <div class="seg" role="group" aria-label="Playback mode">
      <button id="mAuto" type="button" aria-pressed="true">Auto-play</button>
      <button id="mStep" type="button" aria-pressed="false">Step-through</button>
    </div>
    <span class="spacer"></span>
    <button id="bFull" type="button">⛶ Full screen</button>
  </div>
  <div class="progress" id="prog"><div id="bar"></div></div>
  <div class="chapters" id="chapters"></div>
  <p class="hint">Keys: Space = play / pause · ← → = previous / next stage · F = full screen. Step-through pauses at the end of every stage — ideal when presenting live. Figures are sample outputs from the Renewables Market Intelligence Ledger (test runs 7–9 Oct 2026).</p>
</div>

window.__seek=function(x){t=x;playing=false;resize();render(t);};
requestAnimationFrame(frame);
})();
</script>
